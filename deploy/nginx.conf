# /etc/nginx/sites-available/matinee.prahladsingh.in
server {
    listen 80;
    server_name matinee.prahladsingh.in;

    client_max_body_size 0;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    root /var/www/projects/matinee/client/dist;

    # Videos: Node checks login, Nginx sends the file (sendfile + Range)
    location /_media/ {
        internal;
        alias /var/media/matinee/;       # must equal MEDIA_ROOT (keep trailing slash)
        sendfile on;
        tcp_nopush on;
        aio threads;
        add_header Cache-Control "private, max-age=3600";
    }

    location /api/ {
        proxy_pass http://localhost:5009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
